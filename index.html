  while(idx<I.n-1&&within>=acc+I.d[idx]){ acc+=I.d[idx]; idx++; }
  var local=within-acc;
  var step=ex.steps[idx], prev=ex.steps[(idx+I.n-1)%I.n];
  var k=Math.min(1,local/Math.min(1800,I.d[idx]*0.45)); k=k*k*(3-2*k);

var DAY=86400000;
function dayStart(d){ var x=new Date(d); x.setHours(0,0,0,0); return x.getTime(); }

function weekLine(){ var n=weekCount(); return n+' of '+S.goal+' sessions this week'+(n>=S.goal?'. Goal reached.':''); }
function logHTML(readonly){
  var today=dayStart(Date.now()), days=[], max=1;
  for(var i=6;i>=0;i--){ var s=today-i*DAY, c=S.log.filter(function(l){return l.ts>=s&&l.ts<s+DAY;}).length; if(c>max) max=c; days.push({s:s,c:c}); }
  var bars=days.map(function(d){
    var label=new Date(d.s).toLocaleDateString('en-GB',{weekday:'short'}), h=d.c?Math.max(10,Math.round(d.c/max*100)):3;

  }).join('');
  var recent=S.log.slice(-5).reverse().map(function(l){
    return '<li><div class="top"><b>'+esc(l.n)+'</b><span class="small muted">'+new Date(l.ts).toLocaleDateString('en-GB',{day:'numeric',month:'short'})+'</span></div></li>';
  }).join('')||'<li class="muted">No sessions logged yet. Finish an exercise video and tap Log this session.</li>';
  var n=weekCount(), pct=Math.min(100,n/S.goal*100).toFixed(0);

   (readonly?'':'<label for="goal" style="max-width:220px">Weekly goal<select id="goal">'+[1,2,3,4,5,6,7].map(function(g){return '<option value="'+g+'"'+(g===S.goal?' selected':'')+'>'+g+' sessions</option>';}).join('')+'</select></label>')+

   '<div class="bars" aria-label="Sessions in the last 7 days">'+bars+'</div>'+
   '<h3>Recent</h3><ul class="rows">'+recent+'</ul>';
}

  var a=t.dataset.pl;
  if(a==='play'){ if(pl.playing) plPause(); else plPlay(); plRender(); }
  else if(a==='restart'){ plPause(); pl.t=0; pl.last=''; plPlay(); }
  else if(a==='log'){ S.log.push({n:EX[pl.ex].t,ts:Date.now()}); save(); var w=$('#wk-line'); if(w) w.textContent=weekLine(); toast('Session logged: '+EX[pl.ex].t+'.'); }
  else if(a==='sound'){ pl.voice=!pl.voice; if(!pl.voice){ try{ window.speechSynthesis.cancel(); }catch(x){} } VIEWS.videos(); }
  else if(a==='en'||a==='bn'){ plPause(); pl.lang=a; pl.t=0; pl.last=''; VIEWS.videos(); }
  else if(a==='slow'){ pl.speed=0.6; VIEWS.videos(); }
  else if(a==='normal'){ pl.speed=1; VIEWS.videos(); }
});

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-go],[data-role],[data-band],[data-book],[data-undo]'); if(!t) return;
  if(t.dataset.go){ e.preventDefault(); show(t.dataset.go); }
  else if(t.dataset.role){ R=t.dataset.role; show(NAV[R][0][0]); }
  else if(t.dataset.band){ guideBand=+t.dataset.band; VIEWS.guide(); }
  else if(t.dataset.book){
    var d=DOCS[+t.dataset.book];
    S.appts.push({t:'Visit request',w:'Waiting for the clinic to confirm',who:d.n+', '+d.sp,s:'Requested'}); save();
    toast('Demo: request saved for '+d.n+'. Nothing was sent.');
  }
  else if(t.dataset.undo){ delete S.ms[t.dataset.undo]; save(); VIEWS.progress(); }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.task){ if(t.checked) S.done[t.dataset.task]=1; else delete S.done[t.dataset.task]; save(); updateHome(); }
  else if(t.dataset.sign){ var i=+t.dataset.sign, p=S.signs.indexOf(i); if(t.checked&&p<0) S.signs.push(i); if(!t.checked&&p>-1) S.signs.splice(p,1); save(); updateSigns(); }
  else if(t.id==='goal'){ S.goal=+t.value; save(); VIEWS.progress(); }
  else if(t.id==='d-city'){ docCity=t.value; updateDocs(); }
  else if(t.id==='d-spec'){ docSpec=t.value; updateDocs(); }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='c-name'){ S.child.name=t.value; save(); updateHome(); }
  else if(t.id==='c-age'){ var v=parseInt(t.value,10); if(!isNaN(v)){ S.child.age=Math.max(0,Math.min(300,v)); guideBand=null; save(); updateHome(); } }
});
document.addEventListener('submit',function(e){
  e.preventDefault();
  if(e.target.id==='ms-form'){
    var k=$('#ms-k').value, a=parseInt($('#ms-a').value,10);
    if(!k||isNaN(a)) return;
    S.ms[k]=Math.max(0,Math.min(300,a)); save(); VIEWS.progress(); toast('Milestone saved.');
  } else if(e.target.id==='ord-form'){
    var picked=$$('[data-ord]:checked'); if(!picked.length){ toast('Select at least one test.'); return; }
    var note=$('#ord-note').value.trim();
    picked.forEach(function(c){ S.tests.unshift({n:ORDERS[+c.dataset.ord],s:'Ordered',d:'26 Oct',note:note}); });
    save(); VIEWS.orders(); toast(picked.length+' test'+(picked.length>1?'s':'')+' sent to the caregiver.');
  }
});

var h=(location.hash||'').replace('#','');
show(/^[a-z]+$/.test(h)?h:'home');
})();
</script>
