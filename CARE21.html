<style>
/* Layout: sticky app header with role switch and tabs; one view at a time; cards only where a block is its own object (profile, routine, doctor). */
:root{
  --bg:#F3F6FC; --surface:#FFFFFF; --surface-2:#E7EEFB; --ink:#10234A; --ink-2:#4A5D83; --line:#D3DEF0;
  --accent:#2456C8; --on-accent:#FFFFFF; --sun:#F6BC2F; --on-sun:#2B2000; --range:#B9CBF3;
  --ok:#17794F; --ok-bg:#DDF3E8; --warn:#8A5200; --warn-bg:#FCEBC8; --info:#1B4DB5; --info-bg:#DCE7FC;
  --font-display:'Bricolage Grotesque',system-ui,sans-serif; --font-body:'Figtree','Noto Sans Bengali',system-ui,sans-serif;
  --scrim:rgba(11,22,48,.8); --on-scrim:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1630; --surface:#122046; --surface-2:#1A2C5B; --ink:#E9EFFC; --ink-2:#A7B7DA; --line:#2A4079;
    --accent:#8FAEFF; --on-accent:#0B1630; --sun:#F6BC2F; --on-sun:#2B2000; --range:#34508F;
    --ok:#6FD6A3; --ok-bg:#12382B; --warn:#F3C26B; --warn-bg:#3F2F0C; --info:#A9C1FF; --info-bg:#1D3270; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1630; --surface:#122046; --surface-2:#1A2C5B; --ink:#E9EFFC; --ink-2:#A7B7DA; --line:#2A4079;
  --accent:#8FAEFF; --on-accent:#0B1630; --sun:#F6BC2F; --on-sun:#2B2000; --range:#34508F;
  --ok:#6FD6A3; --ok-bg:#12382B; --warn:#F3C26B; --warn-bg:#3F2F0C; --info:#A9C1FF; --info-bg:#1D3270; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
.wrap{max-width:1080px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(1.6rem,4.2vw,2.3rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:1.2rem;font-weight:800}
h3{font-size:1rem;font-weight:600}
p{margin:0}
.muted{color:var(--ink-2)}
.small{font-size:.86rem}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:1.35rem;letter-spacing:.01em;color:var(--ink);text-decoration:none}
.role{display:flex;background:var(--surface-2);border-radius:999px;padding:3px}
.role button{border:0;background:transparent;color:var(--ink-2);font:600 .85rem var(--font-body);padding:6px 14px;border-radius:999px;cursor:pointer}
.role button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:0 8px;scrollbar-width:thin}
.tabs button{flex:none;border:0;background:transparent;color:var(--ink-2);font:600 .92rem var(--font-body);padding:8px 12px;border-radius:8px;cursor:pointer}
.tabs button[aria-current="page"]{background:var(--surface-2);color:var(--ink);box-shadow:inset 0 -3px 0 var(--sun)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

.demo{background:var(--info-bg);color:var(--info);font-size:.84rem;padding-block:7px}
main{padding-block:24px 56px}
section[data-view]{display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-direction:column;gap:6px;max-width:62ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.fields{display:flex;gap:12px;flex-wrap:wrap}
label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.86rem;min-width:0}
input[type=text],input[type=number],select,textarea{font:500 1rem var(--font-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0;width:100%}
.fields label{flex:1 1 140px}
textarea{min-height:84px;resize:vertical}
.btn{font:700 .92rem var(--font-body);border:0;border-radius:8px;padding:10px 16px;background:var(--accent);color:var(--on-accent);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.small{padding:6px 10px;font-size:.8rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.checks,.rows,.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.checks li{border-top:1px solid var(--line)}
.checks li:first-child{border-top:0}
.checks label{flex-direction:row;align-items:flex-start;gap:12px;font-weight:500;font-size:.96rem;padding:10px 0;cursor:pointer}
.checks input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.checks .meta{margin-left:auto;color:var(--ink-2);font-size:.82rem;white-space:nowrap;padding-left:8px}
.checks input:checked + span{color:var(--ink-2);text-decoration:line-through}
.rows li{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-top:1px solid var(--line)}
.rows li:first-child{border-top:0}
.rows .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.pill{display:inline-block;font-size:.74rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--info-bg);color:var(--info)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}

.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 .88rem var(--font-body);padding:8px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.guide h3{color:var(--accent)}
.guide ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
.result{border-radius:12px;padding:16px;background:var(--info-bg);color:var(--info);display:flex;flex-direction:column;gap:10px}
.result strong{font-family:var(--font-display);font-size:1.1rem}
.result.warn{background:var(--warn-bg);color:var(--warn)}

.plot{padding-inline:10px;display:flex;flex-direction:column;gap:14px}
.ms-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;margin-bottom:4px}
.ms-h b{font-weight:600}
.track{position:relative;height:24px;border-bottom:1px solid var(--line);background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:18.1818% 100%;background-repeat:repeat-x}
.range{position:absolute;top:6px;height:12px;border-radius:6px;background:var(--range)}
.now{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--accent)}
.dot{position:absolute;top:3px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--sun);border:2px solid var(--ink)}
.axis{position:relative;height:18px;margin-inline:10px;font-size:.74rem;color:var(--ink-2)}
.axis span{position:absolute;transform:translateX(-50%)}
.axis span:first-child{transform:none}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.82rem;color:var(--ink-2)}
.legend i{display:inline-block;vertical-align:middle;margin-right:6px}
.lg-r{width:22px;height:10px;border-radius:5px;background:var(--range)}
.lg-n{width:2px;height:14px;background:var(--accent)}
.lg-d{width:12px;height:12px;border-radius:50%;background:var(--sun);border:2px solid var(--ink)}
.linkbtn{border:0;background:none;color:var(--accent);font:600 .8rem var(--font-body);cursor:pointer;padding:0;text-decoration:underline}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.92rem}
th,td{text-align:left;padding:10px 14px;border-top:1px solid var(--line);vertical-align:top}
thead th{border-top:0;background:var(--surface-2);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase}
.doc{display:flex;gap:14px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.doc .km{font-family:var(--font-display);font-weight:800;font-size:1.1rem;white-space:nowrap}
.toast{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none;z-index:50}
.toast span{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.9rem;box-shadow:0 4px 18px rgba(0,0,0,.25)}
footer{color:var(--ink-2);font-size:.84rem}
.stage{position:relative;background:var(--surface-2);border-radius:10px;overflow:hidden}
.stage svg{display:block;width:100%;height:auto}
.cap{position:absolute;left:0;right:0;bottom:0;padding:10px 14px;background:var(--scrim);color:var(--on-scrim);font-weight:600;text-align:center;min-height:3.2em;display:flex;align-items:center;justify-content:center}
.pbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.pbar div{height:100%;width:0;background:var(--sun)}
.pmeta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.84rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.ctrl{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center}
.seg.tight button{padding:6px 12px;font-size:.82rem}
.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px;color:var(--ink-2)}
.steps li.on{color:var(--ink);font-weight:700}
@media (prefers-reduced-motion: no-preference){ .tabs button,.btn{transition:background .15s,color .15s} }
</style>

function plInfo(){ var ex=EX[pl.ex], n=ex.steps.length, cycle=n*STEPMS; return {ex:ex,n:n,cycle:cycle,total:cycle*ex.reps}; }

function plDraw(p){

  var set=function(id,d){ var el=$('#'+id); if(el) el.setAttribute('d',d); };
  set('f-leg2','M'+pt(p.hp)+' L'+pt(p.k2)+' L'+pt(p.f2));
  set('f-body','M'+pt(p.s)+' L'+pt(p.hp));
  set('f-leg','M'+pt(p.hp)+' L'+pt(p.k)+' L'+pt(p.f));
  set('f-neck','M'+pt(p.s)+' L'+pt(p.h));

function plRender(){

  var I=plInfo(), ex=I.ex, done=pl.t>=I.total, t=Math.min(pl.t,I.total-1);
  var rep=Math.floor(t/I.cycle), within=t-rep*I.cycle, idx=Math.floor(within/STEPMS), local=within-idx*STEPMS;
  var step=ex.steps[idx], prev=ex.steps[(idx+I.n-1)%I.n];

  var A=ex.poses[prev.p], B=ex.poses[step.p], pose={};
  PK.forEach(function(key){ pose[key]=[A[key][0]+(B[key][0]-A[key][0])*k, A[key][1]+(B[key][1]-A[key][1])*k]; });

  var dt=Math.min(100,ts-pl.prev); pl.prev=ts; pl.t+=dt*pl.speed;
  var I=plInfo();
  if(pl.t>=I.total){ pl.t=I.total; pl.playing=false; plRender(); plChime(true); plSpeak(TX.done[pl.lang]); return; }
  plRender(); pl.raf=requestAnimationFrame(plTick);
}
function initAudio(){
  try{
    if(!pl.ac){ var C=window.AudioContext||window.webkitAudioContext; pl.ac=C?new C():null; }
    if(pl.ac&&pl.ac.state==='suspended') pl.ac.resume();
  }catch(e){}
}
function plChime(end){
  if(!pl.voice||!pl.ac) return;
  try{
    var o=pl.ac.createOscillator(), g=pl.ac.createGain(), n=pl.ac.currentTime;
    o.type='sine'; o.frequency.value=end?880:660;
    g.gain.setValueAtTime(0.0001,n); g.gain.exponentialRampToValueAtTime(0.12,n+0.03); g.gain.exponentialRampToValueAtTime(0.0001,n+0.45);
    o.connect(g); g.connect(pl.ac.destination); o.start(n); o.stop(n+0.5);
  }catch(e){}
}
function plSpeak(text){
  if(!pl.voice||!('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text); u.lang=(pl.lang==='bn')?'bn-BD':'en-US'; u.rate=0.92;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function plPlay(){
  var I=plInfo();
  if(pl.t>=I.total){ pl.t=0; pl.last=''; }
  pl.playing=true; pl.prev=performance.now(); initAudio();
  cancelAnimationFrame(pl.raf); pl.raf=requestAnimationFrame(plTick);
}
function plPause(){
  pl.playing=false; cancelAnimationFrame(pl.raf);
  try{ if('speechSynthesis' in window) window.speechSynthesis.cancel(); }catch(e){}
  plRender();
}
function stopPlayer(){ if(pl.ex!==null&&pl.playing) plPause(); }
function plNote(){
  if(!pl.voice) return 'Sound is off. Captions show each step.';
  if(!('speechSynthesis' in window)) return 'Spoken steps are not available in this browser. Captions show each step, with a soft chime.';
  var msg='Voice is on. Turn your volume up. A soft chime marks each new step.';
  try{
    var v=window.speechSynthesis.getVoices();
    if(pl.lang==='bn'&&v.length&&!v.some(function(x){return /^bn/i.test(x.lang)})) msg='No Bangla voice was found on this device, so the voice may stay silent. Bangla captions still show.';
  }catch(e){}
  return msg;
}
VIEWS.videos=function(){
  if(pl.ex===null) pl.ex=Math.min(band(S.child.age),3);
  var ex=EX[pl.ex];
  $('#v-videos').innerHTML=
   '<div class="head"><p class="eyebrow">Exercise videos</p><h1>Watch, listen, do together</h1>'+
   '<p class="muted">Animated demonstrations with spoken steps and captions. They show the idea. Your physiotherapist shows the right way for your child.</p></div>'+
   '<div class="seg" role="group" aria-label="Exercise">'+EX.map(function(x,i){return '<button type="button" data-ex="'+i+'" aria-pressed="'+(i===pl.ex)+'">'+x.t+' <span class="small">· '+x.stage+'</span></button>';}).join('')+'</div>'+
   '<div class="grid2"><div class="card"><div class="stage">'+stageSVG(ex)+'<div class="cap" id="pl-cap" lang="'+pl.lang+'"></div></div>'+
   '<div class="pbar" role="progressbar" aria-label="Session progress"><div id="pl-fill"></div></div>'+
   '<div class="pmeta"><span id="pl-time"></span><span id="pl-rep"></span></div>'+
   '<div class="ctrl"><button class="btn" type="button" data-pl="play" id="pl-play">Play</button>'+
   '<button class="btn ghost" type="button" data-pl="restart">Restart</button>'+
   '<div class="seg tight" role="group" aria-label="Speed"><button type="button" data-pl="slow" aria-pressed="'+(pl.speed<1)+'">Slow</button><button type="button" data-pl="normal" aria-pressed="'+(pl.speed>=1)+'">Normal</button></div>'+
   '<div class="seg tight" role="group" aria-label="Language"><button type="button" data-pl="en" aria-pressed="'+(pl.lang==='en')+'">English</button><button type="button" data-pl="bn" aria-pressed="'+(pl.lang==='bn')+'">বাংলা</button></div>'+
   '<div class="seg tight"><button type="button" data-pl="sound" aria-pressed="'+pl.voice+'">Voice and chime: '+(pl.voice?'On':'Off')+'</button></div></div>'+
   '<p class="small muted">'+plNote()+'</p></div>'+
   '<div class="card"><h2>'+ex.t+'</h2><p class="muted small">Suggested for '+ex.stage+'. Repeat '+ex.reps+' times, a few times a week, or as your therapist advises.</p>'+
   '<ol class="steps" id="pl-steps" lang="'+pl.lang+'">'+ex.steps.map(function(s){return '<li>'+s[pl.lang]+'</li>';}).join('')+'</ol>'+
   '<p class="small muted">Stop if your child seems in pain or upset, and tell the doctor about neck pain or new weakness.</p></div></div>';
  plRender();
};
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-ex],[data-pl]'); if(!t) return;
  if(t.dataset.ex!==undefined){ plPause(); pl.ex=+t.dataset.ex; pl.t=0; pl.last=''; VIEWS.videos(); return; }
  var a=t.dataset.pl;
  if(a==='play'){ if(pl.playing) plPause(); else plPlay(); plRender(); }
  else if(a==='restart'){ plPause(); pl.t=0; pl.last=''; plPlay(); }
  else if(a==='sound'){ pl.voice=!pl.voice; if(!pl.voice){ try{ window.speechSynthesis.cancel(); }catch(x){} } VIEWS.videos(); }
  else if(a==='en'||a==='bn'){ pl.lang=a; try{ window.speechSynthesis.cancel(); }catch(x){} pl.last=''; VIEWS.videos(); }
  else if(a==='slow'){ pl.speed=0.6; VIEWS.videos(); }
  else if(a==='normal'){ pl.speed=1; VIEWS.videos(); }
});

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-go],[data-role],[data-band],[data-book],[data-undo]'); if(!t) return;
  if(t.dataset.go){ e.preventDefault(); show(t.dataset.go); }
  else if(t.dataset.role){ R=t.dataset.role; show(NAV[R][0][0]); }
  else if(t.dataset.band){ guideBand=+t.dataset.band; VIEWS.guide(); }
  else if(t.dataset.book){
    var d=DOCS[+t.dataset.book];
    S.appts.push({t:'Visit request',w:'Waiting for the clinic to confirm',who:d.n+', '+d.sp,s:'Requested'}); save();
    toast('Demo: request saved for '+d.n+'. Nothing was sent.');
  }
  else if(t.dataset.undo){ delete S.ms[t.dataset.undo]; save(); VIEWS.progress(); }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.task){ if(t.checked) S.done[t.dataset.task]=1; else delete S.done[t.dataset.task]; save(); updateHome(); }
  else if(t.dataset.sign){ var i=+t.dataset.sign, p=S.signs.indexOf(i); if(t.checked&&p<0) S.signs.push(i); if(!t.checked&&p>-1) S.signs.splice(p,1); save(); updateSigns(); }
  else if(t.id==='d-city'){ docCity=t.value; updateDocs(); }
  else if(t.id==='d-spec'){ docSpec=t.value; updateDocs(); }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='c-name'){ S.child.name=t.value; save(); updateHome(); }
  else if(t.id==='c-age'){ var v=parseInt(t.value,10); if(!isNaN(v)){ S.child.age=Math.max(0,Math.min(300,v)); guideBand=null; save(); updateHome(); } }
});
document.addEventListener('submit',function(e){
  e.preventDefault();
  if(e.target.id==='ms-form'){
    var k=$('#ms-k').value, a=parseInt($('#ms-a').value,10);
    if(!k||isNaN(a)) return;
    S.ms[k]=Math.max(0,Math.min(300,a)); save(); VIEWS.progress(); toast('Milestone saved.');
  } else if(e.target.id==='ord-form'){
    var picked=$$('[data-ord]:checked'); if(!picked.length){ toast('Select at least one test.'); return; }
    var note=$('#ord-note').value.trim();
    picked.forEach(function(c){ S.tests.unshift({n:ORDERS[+c.dataset.ord],s:'Ordered',d:'26 Oct',note:note}); });
    save(); VIEWS.orders(); toast(picked.length+' test'+(picked.length>1?'s':'')+' sent to the caregiver.');
  }
});

var h=(location.hash||'').replace('#','');
show(/^[a-z]+$/.test(h)?h:'home');
})();
</script>
